
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%" height="100%"
     viewBox="0 0 1280 800">

  <foreignObject x="0" y="0"
                 width="1280" height="800">
    <xhtml:div style="
      width:100vw;
      height:100vh;
      margin:0;
      overflow:hidden;
    ">
      <xhtml:iframe
        src="https://chatwork.cloud.run/"
        style="
          width:100%;
          height:100%;
          border:0;
          display:block;
        "
        allow="fullscreen"
      />
    </xhtml:div>
  </foreignObject>
</svg>
